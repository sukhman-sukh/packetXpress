<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacketXpress — System Architecture Animation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    color: #58a6ff;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  .subtitle { font-size: 12px; color: #8b949e; margin-bottom: 14px; }
  #controls {
    display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center;
  }
  button {
    font-size: 13px; padding: 8px 18px;
    border-radius: 6px; border: 1px solid #30363d;
    background: #21262d; color: #c9d1d9;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
  }
  button:hover { background: #2d333b; border-color: #58a6ff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.primary:hover { background: #388bfd; }
  #status {
    font-size: 13px; color: #8b949e; min-height: 22px;
    margin-bottom: 10px; text-align: center; max-width: 700px;
  }
  svg#net {
    width: 100%; max-width: 820px; display: block;
    background: #161b22; border-radius: 12px;
    border: 1px solid #30363d;
  }
  .zone-label { font: 11px 'Segoe UI', Arial, sans-serif; }
  .node-label { font: 500 12px 'Segoe UI', Arial, sans-serif; }
  .node-sub { font: 10px 'Segoe UI', Arial, sans-serif; }
  .arrow-label { font: 9px 'Segoe UI', Arial, sans-serif; }
  @keyframes shieldPulse { 0%,100%{opacity:1} 40%{opacity:0.25} }
  @keyframes notePop { 0%{opacity:0;transform:scale(0.6) translateY(8px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
  .note-pop { animation: notePop 0.3s cubic-bezier(.4,1.5,.6,1) forwards; }
  .iit-badge {
    font-size: 11px; color: #8b949e; margin-top: 14px;
    display: flex; align-items: center; gap: 6px;
  }
</style>
</head>
<body>

<h1>PacketXpress — System Architecture (Forwarding Plane)</h1>
<p class="subtitle">IIT Roorkee · CSN-400B B.Tech Project · May 2026</p>

<div id="controls">
  <button id="btn1" onclick="runScenario1()">▶ Scenario 1: Drop (blocked domain "abc")</button>
  <button id="btn2" onclick="runScenario2()">▶ Scenario 2: Allow + Forward (domain "xyz")</button>
  <button onclick="resetAll()">↺ Reset</button>
</div>
<div id="status">Choose a scenario to begin.</div>

<svg id="net" viewBox="0 0 820 500">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Public internet zone -->
  <rect x="10" y="10" width="175" height="480" rx="10" fill="none" stroke="#444c56" stroke-width="0.8" stroke-dasharray="6 3"/>
  <text x="97" y="30" text-anchor="middle" class="zone-label" fill="#8b949e">Public internet</text>

  <!-- Private cluster zone -->
  <rect x="490" y="10" width="320" height="480" rx="10" fill="none" stroke="#1f6feb44" stroke-width="0.8" stroke-dasharray="6 3"/>
  <text x="650" y="30" text-anchor="middle" class="zone-label" fill="#388bfd">Private cluster</text>

  <!-- Client -->
  <rect x="28" y="210" width="90" height="56" rx="8" fill="#161b22" stroke="#7f6bd4" stroke-width="1"/>
  <text x="73" y="232" text-anchor="middle" class="node-label" fill="#a5a0e8">Client</text>
  <text x="73" y="248" text-anchor="middle" class="node-sub" fill="#7f6bd4">browser / app</text>

  <!-- Gateway outer box -->
  <rect x="295" y="185" width="145" height="130" rx="10" fill="#161b22" stroke="#238636" stroke-width="1"/>
  <text x="367" y="207" text-anchor="middle" class="node-label" fill="#3fb950">Gateway</text>
  <text x="367" y="222" text-anchor="middle" class="node-sub" fill="#238636">PacketXpress</text>

  <!-- XDP Shield (firewall) -->
  <g id="g-shield">
    <polygon id="shield-poly" points="367,245 342,256 342,275 367,286 392,275 392,256"
      fill="#1a1a2e" stroke="#e05252" stroke-width="1.2"/>
    <text x="367" y="270" text-anchor="middle" class="node-sub" font-weight="600" fill="#ff7b7b">XDP</text>
    <text x="367" y="282" text-anchor="middle" style="font:8px 'Segoe UI',Arial" fill="#e05252">firewall</text>
  </g>

  <!-- Packet profiler note (hidden) -->
  <g id="g-note" opacity="0" transform="translate(293,130)">
    <rect width="148" height="46" rx="6" fill="#1a2a1a" stroke="#3fb950" stroke-width="0.8"/>
    <text x="74" y="18" text-anchor="middle" style="font:500 11px 'Segoe UI',Arial" fill="#3fb950">📋 Packet Profiler</text>
    <text x="74" y="33" text-anchor="middle" style="font:9px 'Segoe UI',Arial" fill="#7ee787">Logged: src, dst, TTL, flags ✓</text>
    <text x="74" y="45" text-anchor="middle" style="font:9px 'Segoe UI',Arial" fill="#7ee787">Ring buffer: 0 packet loss</text>
  </g>

  <!-- DNAT label (hidden) -->
  <g id="g-dnat" opacity="0" transform="translate(293,322)">
    <rect width="148" height="36" rx="6" fill="#1a2510" stroke="#6e7d0e" stroke-width="0.8"/>
    <text x="74" y="16" text-anchor="middle" style="font:500 10px 'Segoe UI',Arial" fill="#bef264">DNAT unwrap ↩</text>
    <text x="74" y="30" text-anchor="middle" style="font:9px 'Segoe UI',Arial" fill="#a3e635">Envelope removed, reply sent</text>
  </g>

  <!-- Drop X (hidden) -->
  <g id="g-drop" opacity="0">
    <circle cx="367" cy="370" r="18" fill="#2d0000" stroke="#f85149" stroke-width="1"/>
    <text x="367" y="376" text-anchor="middle" style="font:bold 18px Arial" fill="#f85149">✕</text>
    <text x="367" y="397" text-anchor="middle" style="font:10px 'Segoe UI',Arial" fill="#f85149">DROPPED</text>
  </g>

  <!-- Backend services -->
  <!-- abc -->
  <rect x="520" y="60" width="100" height="50" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="0.8"/>
  <text x="570" y="82" text-anchor="middle" class="node-label" fill="#58a6ff">svc-abc</text>
  <text x="570" y="98" text-anchor="middle" class="node-sub" fill="#1f6feb">:8080</text>

  <!-- def -->
  <rect x="520" y="220" width="100" height="50" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="0.8"/>
  <text x="570" y="242" text-anchor="middle" class="node-label" fill="#58a6ff">svc-def</text>
  <text x="570" y="258" text-anchor="middle" class="node-sub" fill="#1f6feb">:8081</text>

  <!-- xyz -->
  <rect x="520" y="380" width="100" height="50" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="0.8"/>
  <text x="570" y="402" text-anchor="middle" class="node-label" fill="#58a6ff">svc-xyz</text>
  <text x="570" y="418" text-anchor="middle" class="node-sub" fill="#1f6feb">:8082</text>

  <!-- Cluster internal dashed lines (gateway → backends) -->
  <line x1="440" y1="250" x2="518" y2="85" stroke="#1f6feb44" stroke-width="0.6" stroke-dasharray="4 3"/>
  <line x1="440" y1="250" x2="518" y2="245" stroke="#1f6feb44" stroke-width="0.6" stroke-dasharray="4 3"/>
  <line x1="440" y1="250" x2="518" y2="405" stroke="#1f6feb44" stroke-width="0.6" stroke-dasharray="4 3"/>

  <!-- LB label -->
  <text x="490" y="200" text-anchor="middle" style="font:9px 'Segoe UI',Arial" fill="#58a6ff44">Maglev</text>
  <text x="490" y="212" text-anchor="middle" style="font:9px 'Segoe UI',Arial" fill="#58a6ff44">hash O(1)</text>

  <!-- Animated packet -->
  <circle id="pkt" cx="-60" cy="-60" r="11" fill="#7f6bd4" stroke="#a5a0e8" stroke-width="1">
    <title>Animated Packet</title>
  </circle>
  <text id="pkt-lbl" x="-60" y="-75" text-anchor="middle" style="font:bold 9px 'Segoe UI',Arial" fill="#a5a0e8"></text>

  <!-- Encapsulation ring (shown when wrapped) -->
  <circle id="env-ring" cx="-60" cy="-60" r="17" fill="none" stroke="#388bfd" stroke-width="1.5" stroke-dasharray="4 2" opacity="0"/>

</svg>

<p class="iit-badge">IIT Roorkee &nbsp;|&nbsp; High-Performance L4 Gateway — PacketXpress</p>

<script>
const PKT = document.getElementById('pkt');
const LBL = document.getElementById('pkt-lbl');
const ENV = document.getElementById('env-ring');
const NOTE = document.getElementById('g-note');
const DNAT = document.getElementById('g-dnat');
const DROP = document.getElementById('g-drop');
const SHIELD = document.getElementById('shield-poly');
const STATUS = document.getElementById('status');
const B1 = document.getElementById('btn1');
const B2 = document.getElementById('btn2');

let running = false;

function setPos(x, y) {
  PKT.setAttribute('cx', x); PKT.setAttribute('cy', y);
  LBL.setAttribute('x', x); LBL.setAttribute('y', y - 16);
  ENV.setAttribute('cx', x); ENV.setAttribute('cy', y);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function animateTo(x2, y2, steps, delay, x1, y1) {
  const cx = x1 ?? +PKT.getAttribute('cx');
  const cy = y1 ?? +PKT.getAttribute('cy');
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    setPos(cx + (x2 - cx) * t, cy + (y2 - cy) * t);
    await sleep(delay / steps);
  }
}

function setStatus(msg) { STATUS.textContent = msg; }
function disableAll(d) { B1.disabled = d; B2.disabled = d; }

function resetAll() {
  if (running) return;
  setPos(-60, -60); LBL.textContent = '';
  PKT.style.fill = '#7f6bd4'; PKT.setAttribute('r', '11');
  ENV.style.opacity = '0';
  NOTE.style.opacity = '0'; NOTE.classList.remove('note-pop');
  DNAT.style.opacity = '0';
  DROP.style.opacity = '0';
  SHIELD.style.fill = '#1a1a2e'; SHIELD.style.stroke = '#e05252';
  setStatus('Choose a scenario to begin.');
  disableAll(false);
}

async function runScenario1() {
  if (running) return;
  running = true; disableAll(true); resetAll(); await sleep(50);

  LBL.textContent = 'abc'; PKT.style.fill = '#7f6bd4';
  setPos(30, 238);

  setStatus('① Client sends packet for domain "abc" to the Gateway...');
  await animateTo(295, 265, 22, 700);
  await sleep(200);

  setStatus('② Packet reaches XDP firewall. Shield checks blocklist...');
  SHIELD.style.fill = '#3d0000'; SHIELD.style.stroke = '#f85149';
  PKT.style.fill = '#f85149';
  await sleep(500);

  setStatus('③ "abc" is BLOCKED! XDP drops packet before sk_buff allocation. ✕');
  DROP.style.opacity = '1';
  await animateTo(367, 350, 12, 400);
  setPos(-60, -60); LBL.textContent = '';
  await sleep(200);

  setStatus('✅ Done. Packet dropped at driver level — zero OS memory allocated.');
  running = false; disableAll(false);
}

async function runScenario2() {
  if (running) return;
  running = true; disableAll(true); resetAll(); await sleep(50);

  LBL.textContent = 'xyz'; PKT.style.fill = '#7f6bd4';
  setPos(30, 238);

  setStatus('① Client sends packet for domain "xyz" to the Gateway...');
  await animateTo(295, 265, 22, 700);
  await sleep(200);

  setStatus('② XDP firewall checks "xyz" — domain is ALLOWED. Shield clears ✓');
  SHIELD.style.fill = '#0d2b0d'; SHIELD.style.stroke = '#3fb950';
  PKT.style.fill = '#3fb950';
  await sleep(500);

  setStatus('③ Packet Profiler logs: src IP, dst IP, TTL, TCP flags → Ring Buffer');
  NOTE.style.opacity = '1'; NOTE.classList.add('note-pop');
  await sleep(1000);

  setStatus('④ Gateway encapsulates packet (IPIP tunnel) — Maglev hash selects svc-xyz...');
  ENV.style.opacity = '1'; PKT.style.fill = '#388bfd';
  LBL.textContent = '[encapsulated]';
  await animateTo(367, 265, 8, 250);
  await sleep(200);
  await animateTo(520, 405, 28, 900);
  setStatus('⑤ Encapsulated packet delivered to svc-xyz in private cluster...');
  await sleep(600);

  PKT.style.fill = '#f0883e'; LBL.textContent = 'response';
  ENV.style.opacity = '0';
  setStatus('⑥ svc-xyz processes request, sends response back to Gateway...');
  await animateTo(367, 265, 25, 900);
  await sleep(300);

  setStatus('⑦ Gateway performs DNAT — removes encapsulation, rewrites headers...');
  DNAT.style.opacity = '1'; DNAT.classList.add('note-pop');
  await sleep(700);

  setStatus('⑧ Clean response returned to client. Full L4 forwarding complete!');
  await animateTo(118, 238, 18, 650);
  await sleep(500);

  setPos(-60, -60); LBL.textContent = '';
  setStatus('✅ Complete! Client → Firewall → Profiler → Encap → svc-xyz → DNAT → Client');
  running = false; disableAll(false);
}
</script>
</body>
</html>
